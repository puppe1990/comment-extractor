<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Comentários do Reel</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Comentários do Reel</h1>
    <p id="status"></p>
    <p id="counter">0 comentários · 0 respostas</p>
    <div class="actions">
      <button type="button" id="extract">Extrair</button>
      <button type="button" id="pause" disabled>Pausar</button>
      <button type="button" id="download" disabled>Baixar CSV</button>
      <button type="button" id="clear" class="secondary">Limpar</button>
      <button type="button" id="reload" class="secondary">
        Recarregar extensões
      </button>
    </div>
    <p class="hint">Atalho: Alt+Shift+R</p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
